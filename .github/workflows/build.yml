name: Build and Deploy static site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: arxiv-update-and-build
  cancel-in-progress: false

jobs:
  update-arxiv:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Scan recent arXiv papers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run update:arxiv -- --scheduled
          else
            npm run update:arxiv
          fi

      - name: Open pull request for bibliography updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          add-paths: |
            files/data/ref.bib
            files/data/aux.yml
          branch: automation/arxiv-updates
          delete-branch: true
          commit-message: "chore: update recent arXiv publications"
          title: "chore: update recent arXiv publications"
          body: |
            Automated scan of the configured arXiv author pages.

            This pull request contains only papers first posted in the previous three days and their verbatim abstracts.

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ox-quant-info.uk
