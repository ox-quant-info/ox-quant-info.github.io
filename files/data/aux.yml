---
huang2026eigenstate:
  abs: >-
    Quantum simulation is expected to be a main application of quantum computers with realistic utility in quantum chemistry, materials science and beyond. However, preparing excited or general eigenstates is a central challenge, particularly when the desired eigenvalue is not known in advance, or when the overlap with the initial state is insufficient. We introduce the \emph{Dominant Eigenstate Filtering via Eigenprobability Amplification and Thresholding} (DEFEAT) algorithm that identifies and filters the eigenstate with the largest overlap with the supplied initial state. Our key observation is that we do not need prior knowledge of the target eigenvalue, as we construct efficient twirling superoperators that map initial states to eigenprobability density operators $\rho$, diagonal in the Hamiltonian eigenbasis and encoding its spectral weights, alongside its block-encoding implementation. Our crucial innovation is the quadratic amplification of probabilities via the factorisation $\rho = \rho_{\rm sqrt}^\dagger \rho_{\rm sqrt}$, analogous to the recently introduced sum-of-squares spectral amplification (SOSSA), which we use here to amplify the separation between dominant and subdominant components. Thresholding then yields the dominant-eigenstate projector. Compared with conventional phase estimation, DEFEAT improves the dependence on the overlap with the initial state while requiring substantially fewer ancillary qubits. We prove that the query complexity of the filtering step is optimal up to logarithmic factors and establish a complementary lower bound for eigenstate preparation under purified query access to $\rho$. We validate in numerical simulations that the convergence rate of DEFEAT matches our theoretical results, providing an eigenvalue-agnostic primitive for dominant eigenstate filtering, preparation, and property estimation.
  code: https://github.com/ox-quant-info/defeat
huang2026fullqubit:
  abs: >-
    Accurately computing the free energies of biological processes is a cornerstone of computer-aided drug design, but it is a daunting task. The need to sample vast conformational spaces and account for entropic contributions makes the estimation of binding free energies very expensive. While classical methods, such as thermodynamic integration and alchemical free energy calculations, have significantly contributed to reducing computational costs, they still face limitations in terms of efficiency and scalability. We tackle this through a quantum algorithm for estimating free-energy differences by adapting the Liouvillian approach and introducing several algorithmic improvements. We directly implement the Liouvillian operator and give an efficient description of electronic forces acting on nuclear and electronic particles on the quantum ground-state potential-energy surface. This leads to super-polynomial improvements in precision scaling for Liouvillian simulation and a quadratic improvement in scaling with particle number relative to prior quantum algorithms. The algorithm also uses a fully quantum implementation of thermodynamic integration and alchemy, avoiding the expensive entropy-estimation subroutines used previously. These results open a route toward quantum algorithms for drug-discovery calculations.
  arXiv: https://arxiv.org/abs/2508.16719
  note: Accepted at QCTiP 2026 as contributed talk.
sun2026nanostructure:
  abs: >-
    Semiconductor nanostructures are central to emerging technologies, including spin qubits, quantum sensing, and quantum-dot solar cells, but classical methods become difficult to use when several electrons interact. We develop a quantum-simulation framework for multi-electron double quantum dots using a first-quantized representation and algorithms based on Trotterization and qubitization. Classical simulation data are incorporated to make resource estimates more realistic than bounds based only on worst-case theory. Under a standard surface-code model with physical noise of $10^{-3}$, the study estimates that four-electron and eight-electron systems could be simulated on early fault-tolerant hardware with hundreds of thousands of physical qubits. The results suggest that early fault-tolerant quantum computers may help design mature-era quantum technologies.
sun2026space:
  abs: >-
    Continuous rotations remain a major cost in fault-tolerant quantum algorithms even though Clifford operations are comparatively easy to implement. We construct explicit surface-code layouts for catalyst towers and analyze their space, time, and spacetime costs in two option-pricing examples: a parallel phase oracle and variational state preparation. At small and intermediate code distances, catalyst-tower constructions can reduce runtime and total spacetime volume, while conventional Clifford+T synthesis can become more efficient at larger distances. The preferred method depends on the application, physical error rate, code distance, and the balance between available qubits and circuit depth.
hasselgren2026quantum-inspired:
  abs: >-
    Tensor-network simulation of quantum many-body dynamics is limited by entanglement growth and is typically sequential because the state is updated at each time step. We adapt the randomized TE-PAI time-evolution method to classical matrix-product-state simulation, representing an ensemble of shallow random circuits that gives an unbiased estimator of the exact dynamics. Because each circuit instance produces a deterministic state or observable value, the method avoids quantum shot noise and can be massively parallelized. Simulations of disordered one-dimensional spin rings show reductions in per-sample gate count of up to three orders of magnitude compared with Trotterized MPS evolution, along with improved robustness to severe bond-dimension truncation.
goh2026direct:
  abs: >-
    We develop quantum algorithms for directly estimating the density of states of fermionic systems, a quantity from which thermodynamic properties can be obtained. The method can target a fixed-particle-number sector rather than the full Hilbert space, which is important for fermionic systems and both canonical and grand-canonical ensembles. By time-evolving simple random initial states, the density of states is recovered on average, while finite circuit depth naturally produces a Gaussian-smoothed spectrum. The approach is therefore suitable for early quantum hardware: even noisy short-time dynamics can give a semi-quantitative density of states, and longer evolution on fault-tolerant devices can improve the resolution. Numerical studies on Fermi-Hubbard and spin models demonstrate robustness to time-evolution errors, gate noise, and integration with variational methods.
huang2026low-depth:
  abs: >-
    Amplitude estimation, in its original form, is formulated as phase estimation upon the Grover iterate. Subsequent improvements to the algorithm have eliminated the need for phase estimation and introduced low-depth variants that trade speedups for lower circuit depth. We make the key observation that amplitude estimation is equivalent to estimating the energy gap of an effective Hamiltonian, whereby discrete-time evolution is generated by amplitude amplification. This enables us to develop an amplitude estimation algorithm for both Heisenberg-limited and low-depth circuit regimes, inspired by statistical phase estimation techniques developed for early fault-tolerant ground-state energy estimation. In the Heisenberg-limited regime, our approach achieves performance comparable to state-of-the-art methods while using simplified classical post-processing. In the low-depth regime, it obtains optimal query--depth tradeoffs up to polylogarithmic factors, with provable guarantees and improved empirical performance over prior approaches. The resulting protocol is ancilla-free and requires only standard Grover reflections.
  code: https://github.com/georgepwhuang/qae_with_spe
siegel2026quantum:
  abs: >-
    Silicon-spin quantum processors may benefit from physically shuttling qubits to improve connectivity, but static defects can damage a moving logical qubit. We propose an architecture in which logical qubits are one-dimensional strings, or “snakes”, that move across a planar lattice. Monitor qubits and a complementary gap reveal potentially damaging scratch events; when a risk is detected, the motion can be reversed so that the corruption is removed. The architecture also supports logical operations between snakes through a semitransversal procedure. These features provide a route to fault-tolerant computation on both near-term and mature silicon-spin devices.
bako2026exponential:
  abs: >-
    We develop a hybrid quantum-classical method for estimating arbitrary observable expectation values in a Hamiltonian eigenstate when the supplied initial state has dominant, but not necessarily exclusive, overlap with the target. Random time evolution produces an averaged mixed state whose dominant eigenproperty is then extracted by a virtual-purification procedure using only one state copy. The resulting error suppression is exponential, and the complexity depends directly on the relevant energy gap, with precision scaling comparable to phase estimation combined with amplitude estimation. Numerical studies cover near-term and early fault-tolerant settings, while tensor-network simulations of a 100-qubit example demonstrate a quantum-inspired classical implementation for ground- and excited-state properties.
erle2026shadow:
  abs: >-
    Ground-state preparation is expected to be an important application of quantum computers, but measurements are costly in early fault-tolerant devices. We introduce the Shadow Enhanced Greedy Quantum Eigensolver (SEGQE), a measurement-efficient greedy method assisted by classical shadows. At each iteration, classical post-processing evaluates the energy reduction associated with many candidate local gates and selects the gate with the largest estimated decrease. We derive per-iteration sample-complexity bounds with only logarithmic dependence on the number of candidates. Numerical tests on transverse-field Ising models and random local Hamiltonians show approximately linear iteration scaling with system size while retaining high-fidelity ground-state approximations.
dai2026stratified:
  abs: >-
    Quasi-probability decompositions replace a difficult quantum circuit by an ensemble of easier circuits, but the resulting sampling variance can be much larger than Born-rule shot noise. We develop a general framework for reducing this configuration variance through stratified sampling. Under ideal proportional allocation, the estimator remains unbiased and its variance is never larger than that of naive sampling, with equality only in degenerate cases. A classical dynamic program supports stratification for arbitrary product-form decompositions. Simulations of probabilistic error cancellation and probabilistic angle interpolation show substantial constant-factor reductions in sampling cost without additional quantum resources.
pages2026low-resource:
  abs: >-
    Estimating many-body energy spectra is important in quantum chemistry and condensed-matter physics, but accurate time evolution can require circuits too deep for near-term devices. We combine algorithmic shadow spectroscopy with Time Evolution via Probabilistic Angle Interpolation (TE-PAI), which uses shallow stochastic circuits while retaining an unbiased quasiprobability estimator. The resulting protocol resolves energy gaps and is more robust to gate noise than standard Trotter-based shadow spectroscopy in numerical experiments. Demonstrations on IBM hardware with systems of up to 20 qubits support the use of the method for low-resource spectral analysis.
wdai2026structure-aware:
  abs: >-
    Randomized Hamiltonian-simulation methods trade systematic bias against sampling overhead. We study variance-reduction techniques that preserve the mean channel and therefore do not add bias, using continuous TE-PAI as an unbiased random-circuit estimator of time evolution. The variance separates into a classical counting contribution and a quantum ordering contribution associated with noncommuting Hamiltonian terms. Structure-aware reductions lower errors substantially in small systems and tensor-network simulations, producing large reductions in the sampling cost of spin-chain dynamics. The results also show that continuous TE-PAI can avoid the unphysical bond-dimension growth caused by discretization error in Trotterized simulations.
kiumi2025te-pai:
  abs: >-
    We introduce TE-PAI, a method that simulates Hamiltonian time evolution exactly on average by sampling random quantum circuits and averaging measured observables. It builds on probabilistic angle interpolation and removes discretization and algorithmic error while using shallow circuits that saturate the Lieb-Robinson bound. The circuits use only Pauli rotations with two tunable angles and $±\Delta$ together with measurements. We also develop an early fault-tolerant implementation based on catalyst circuits and repeat-until-success teleportation, estimating a large reduction in T-state consumption compared with Trotterization for a 100-qubit Heisenberg model. The rotation angle provides a configurable trade-off between circuit depth and measurement overhead.
xie2025advances:
  abs: >-
    This review surveys progress and open challenges in quantum computation during the noisy intermediate-scale quantum era. It discusses improved variational algorithms, hybrid quantum-classical methods, quantum error mitigation, benchmarking, and applications in quantum chemistry, materials science, machine learning, and optimization. The review emphasizes how noise, limited qubit counts, imperfect gates, and restricted connectivity constrain practical advantage, and identifies theoretical and experimental directions for evaluating NISQ performance under realistic conditions.
araki2025space-time:
  abs: >-
    Modular quantum computers connect smaller hardware nodes through quantum communication links, offering a possible route to scalable architectures. We analyze three practical implementations of virtual distillation that span the space-time trade-off: a qubit-minimizing deep circuit, more parallel implementations using extra qubits, and a constant-depth construction. We derive their circuit-depth and gate-count requirements, give architectures for networked and early fault-tolerant systems, and compare them under realistic ion-trap noise. Virtual distillation suppresses errors even for noisy states; the constant-depth design generally outperforms the qubit-minimizing design, and local-gate noise is more limiting than remote entangling noise.
hanzo2025quantum:
  abs: >-
    This survey reviews recent developments in quantum information processing, sensing, and communications and identifies knowledge gaps for future research. It covers decoherence and quantum error mitigation with and without coding, quantum machine learning, and quantum radar, and discusses the prospects for integrated sensing and communications in the quantum domain. It concludes with research directions for secure quantum communications that draw on ideas from classical communications engineering.
sun2025low-depth:
  abs: >-
    We study the implementation of phase oracles that apply a phase depending on a function of a computational-basis register, including piecewise-linear functions relevant to Hamiltonian simulation and derivative pricing. Parallelizing the piecewise construction allows all elementary rotations to be performed at the same time, giving rotation depth one. Recursive catalyst towers can implement these rotations efficiently, with depth scaling logarithmically in the register size and number of pieces. In the repeated-oracle setting, the catalyst approach has linear T-count in the number of pieces and register qubits, while a QROM-based interpolation has a different polynomial scaling.
chan2025algorithmic:
  abs: >-
    We present shadow spectroscopy, a simulator-agnostic algorithm for estimating energy gaps with few circuit repetitions and no ancilla qubits beyond those needed for time evolution and measurement. Classical shadows of time-evolved states are post-processed into many time-periodic signals whose frequencies reveal Hamiltonian energy differences with Heisenberg-limited precision. Quantum resources scale logarithmically in the number of processed observables, while classical work is linear and the signal-to-noise ratio improves with the number of signals. Simulations, molecular examples, experiments on IBM hardware, and tensor-network calculations up to 100 qubits demonstrate low-shot operation, noise robustness, and scalability.
cai2025biased:
  abs: >-
    Classical shadows extract many properties of a quantum state from relatively few measurements, but the conventional estimator is unbiased and can have substantial finite-sample variance. We study deliberately biased estimators obtained by rescaling the standard shadow estimator, requiring no additional quantum resources. Average-, worst-, and best-case analyses show when the bias reduces total estimation error and establish that introducing bias can be advantageous in principle. A 12-qubit spin-ring simulation demonstrates more efficient estimation of nonlocal perturbations than the unbiased scheme.
boyd2025high-dimensional:
  abs: >-
    We introduce a post-processing method that uses classical-shadow data for high-dimensional subspace expansion and more accurate ground-state estimation. Useful observables are selected efficiently from the shadow data, then a regularized subspace expansion is applied to remain numerically stable in the presence of noise. We analyze noise propagation and statistical fluctuations from finite snapshots. Numerical experiments show large reductions in energy-estimation error, including in the presence of coherent state-preparation errors and gate noise, without requiring additional quantum resources.
hwang2025preparing:
  abs: >-
    CoVaR trains variational quantum circuits by finding roots of many Hamiltonian-operator covariances using classical shadows, but it traditionally needs a good initial state. We introduce an adiabatic version that gradually morphs an easily solved Hamiltonian into the target while repeatedly applying CoVaR. The method can prepare ground and excited states even when energy gaps are small, avoiding the inverse-gap circuit-depth scaling of adiabatic evolution and phase estimation. Although the final excited state is not always predetermined, this feature can be used to map low-lying spectra for applications such as thermal-property estimation and high-energy physics.
zimboras2025myths:
  abs: >-
    This perspective revisits common claims about the capabilities and limitations of quantum computers before full fault tolerance. It examines what theoretical no-go results do and do not imply for quantum error mitigation, variational algorithms, circuit depth, and algorithmic feasibility. The authors identify near-term opportunities and combinations of error mitigation with early fault-tolerant architectures, arguing that hardware and algorithm design should continue to be developed together to bridge the gap between asymptotic promise and practical quantum advantage.
koczor2024sparse:
  abs: >-
    We develop a probabilistic approach for implementing quantum operations that can only be approximated with finite resources. A large library of cheap approximations is constructed and sampled according to an optimized probability distribution so that the desired operation is realized exactly on average with controllable variance. Convex optimization is used to find sparse distributions efficiently. Applications include exact continuous-rotation synthesis with low T-count circuits in fault-tolerant computers and the construction of broadband or band-selective pulses in quantum optimal control, NMR, and MRI.
das2024purification:
  abs: >-
    We introduce quantum filters that combine ideas from quantum error mitigation and correction to purify or correct noisy quantum channels. A commutation-derived filter corrects arbitrary noise in an $n$-qubit Clifford circuit using $2n$ clean ancillary qubits and a single use of the target channel, while related constructions partially purify non-Clifford gates. An ancilla-efficient Pauli filter removes most low-weight Pauli error components with only two ancillas, can turn unbiased noise into biased noise useful for biased-noise codes, and gives a quadratic reduction in average infidelity for local depolarizing noise.
koczor2024probabilistic:
  abs: >-
    Probabilistic angle interpolation implements a continuously parameterized rotation on hardware that supports only a finite set of rotation angles. Instead of rounding to the nearest gate or increasing circuit depth, the method randomly chooses among three neighboring discretized settings and combines measurement outcomes classically. The construction is optimal in sampling overhead, and the overhead remains modest even for thousands of parameterized gates with only a few bits of angle resolution. The results suggest that early quantum processors can operate with substantially less analog-control precision than conventional deterministic implementations require.
jnane2024quantum:
  abs: >-
    Classical shadows can learn many properties of a state with few measurements, but noisy quantum devices normally return properties of a noisy state. We combine classical shadows with quantum error-mitigation techniques, especially probabilistic error cancellation, to estimate properties of the ideal state. The resulting error-mitigated shadows are unbiased, and their sample complexity differs from conventional shadows by the mitigation sampling overhead rather than directly by the number of qubits. Numerical studies demonstrate applications to state estimation and other tasks on near-term and early fault-tolerant hardware.
foldager2024can:
  abs: >-
    Shallow circuits are often expected to turn local noise into approximately global depolarizing noise, a property that benefits several error-mitigation methods. We investigate this assumption for practical shallow quantum circuits using density-matrix eigenvalue uniformity and a commutator norm as diagnostics. Analytical estimates and simulations show that white noise can be a poor approximation in some cases, limiting simple mitigation methods, while the commutator norm remains small enough for purification-based mitigation to work well. Gate insertions and randomized compiling can improve both diagnostics.
koczor2023phase:
  abs: >-
    We develop a unified treatment of phase-space representations for finite-dimensional quantum systems and connect them with parity operators and the Cohen class of distributions. The framework characterizes when generalized phase-space distributions exist, relates different quantization schemes, and gives an efficient number-state representation of the Born--Jordan parity operator. Examples of quantum states illustrate distinctive features of the Born--Jordan distribution and show how the construction extends phase-space methods beyond the standard Wigner representation.
jones2023distributed:
  abs: >-
    We present algorithms for distributed full-state simulation of quantum circuits, including gates, operators, noise channels, density matrices, and partial traces. The work shows that a common state-distribution model can support advanced operations such as Pauli gadgets and many-controlled unitaries while offering polynomial improvements for some nonlocal simulations. The algorithms are developed for both quantum-information and high-performance-computing audiences and are implemented in an open-source minimalist C++ project with extensive tests.
koczor2022quantum1:
  abs: >-
    We generalize quantum natural-gradient descent from noiseless unitary circuits to arbitrary quantum states generated by completely positive maps, including mixed states, imperfect gates, and measurements. The quantum Fisher information supplies the metric on density-operator space, while a modified error-suppression protocol permits efficient approximation using a Hilbert--Schmidt metric. We prove that these metrics are approximately equivalent for typical noisy states and demonstrate in simulations that the method can outperform other variational optimization techniques.
boyd2022training:
  abs: >-
    CoVaR is an alternative to minimizing a single variational energy surface: it finds eigenstates by solving a growing collection of covariance-root equations between the Hamiltonian and an operator pool. Classical shadows allow many covariances to be estimated simultaneously with a logarithmic number of quantum measurements and tractable classical linear-algebra costs. A stochastic Levenberg--Marquardt update gives an optimization method whose per-iteration quantum cost is comparable to gradient estimation. Numerical experiments show much faster convergence than conventional variational optimization for representative problems.
jnane2022multicore:
  abs: >-
    We study scalable multicore quantum processors made from fixed-size computing regions connected by communication channels. Focusing on semiconductor electron-spin systems, we model shuttling and microwave links, estimate communication fidelities, and find that inter-core operations are promising but less accurate than intra-core gates. Optimized entanglement purification can raise communication fidelity to about 99.5%. Simulations of error-mitigation protocols in the multicore setting indicate that the architecture can suppress imperfections in both inter- and intra-core operations.
rattew2022preparing:
  abs: >-
    We develop methods for preparing quantum states whose amplitudes follow arbitrary continuous functions, with complexity logarithmic in the desired resolution and rigorous error bounds. The central primitive simulates rank-one projectors and can be combined with quantum-information tools for state preparation, numerical integration of Lipschitz-continuous functions, and improved sampling from probability densities. The framework is intended for applications such as financial forecasting and real-space molecular simulation, where efficient preparation of structured continuous data is essential.
koczor2022quantum2:
  abs: >-
    We introduce Analytic Descent for variational quantum algorithms. The local energy landscape around a reference circuit can be approximated by a simple classical model, allowing a classical optimizer to jump directly toward an estimated minimum instead of following many small gradient steps. We give complexity-theoretic justification for the approximation, derive a measurement strategy for constructing it, and show that the asymptotic quantum-resource cost of a jump is comparable to a single gradient-vector evaluation.
koczor2021dominant:
  abs: >-
    We analyze the dominant eigenvector of a noisy quantum state, which is the state accessed by techniques such as error suppression by derangements and virtual distillation. The dominant eigenvector generally differs from the ideal computational state, creating a coherent mismatch. We prove that, in relevant noise models, this mismatch is exponentially smaller than the incoherent loss of fidelity that these methods suppress, and we solve the corresponding eigenvector perturbation problem for important classes of density matrices. The results clarify when purification-based error mitigation can faithfully recover useful state properties.
koczor2021exponential:
  abs: >-
    We introduce error suppression by derangements, a noise-mitigation method that uses several independently prepared copies of a circuit output and a shallow controlled derangement before measurement. For observable expectation values, the contribution of error states can be suppressed exponentially as the number of copies grows, without introducing a full quantum error-correcting code. The method is modular, its derangement circuit has linear size and is resilient to imperfections, and simulations show suppression below $10^{-6}$ for noisy circuits with hundreds of gates using only a few copies.
straaten2021measurement:
  abs: >-
    Metric-aware variational algorithms estimate both a matrix and a vector, for example the quantum Fisher-information matrix and gradient used by quantum natural gradient. We characterize the measurements required to determine an update step to fixed precision and derive a general allocation strategy for distributing samples between matrix and vector entries. The analysis shows that the repetition cost of estimating the metric becomes asymptotically negligible relative to repeated optimization steps as the number of iterations and qubits increases.
koczor2020fast:
  abs: >-
    We develop fast algorithms for computing spherical phase-space functions of finite-dimensional quantum states, including single qudits and permutation-symmetric multi-qubit states. A Fourier-series formulation combined with fast Fourier transforms avoids the expensive tensor-operator and spherical-harmonic calculations used previously. The resulting implementations are at least an order of magnitude faster over the tested dimensions and make it practical to visualize and analyze substantially larger entangled quantum states.
koczor2020variational-state:
  abs: >-
    We use variational quantum circuits to search for metrologically useful states in the presence of noise. Simulations of systems with up to nine qubits find highly entangled states that are not permutation symmetric and can outperform previously known states by a constant factor of up to two. The study compares several environmental noise models, shows that passive states do not change the fundamental asymptotic scaling, and outlines an experimental implementation suitable for near-term hardware.
koczor2020continuous:
  abs: >-
    We give a unified description of continuous phase-space representations for finite-dimensional quantum states, clarifying their relations to one another and to the infinite-dimensional phase spaces of quantum optics. The construction applies to arbitrary single spins and qudits, recovers the optical limit as the spin grows, and provides a framework for translating between different representations. We also detail a tomographic reconstruction procedure for these representations and discuss experimental measurement and calibration requirements.
koczor2019time:
  abs: >-
    We develop a Wigner-function formalism for coupled finite-dimensional spin systems and use it to describe their time evolution. The theory treats an arbitrary number of coupled spin-$1/2$ particles, gives explicit equations of motion, and provides closed calculations for systems of up to three spins. Examples illustrate how the phase-space representation exposes the structure and dynamics of multipartite quantum states and can be adapted to experimental settings.
koczor2019continuous:
  abs: >-
    We construct star products for continuous phase spaces of single spins with arbitrary spin number. Spin-weighted spherical harmonics provide a compact description of the exact time evolution and connect finite-spin phase spaces to the quantum-optical limit. We derive efficient large-spin approximations, apply them to phase-space representations of difficult states, and outline how the formalism extends to coupled spins.
koczor2019phase-space:
  abs: >-
    This dissertation develops phase-space representations for finite-dimensional spin systems and relates them to infinite-dimensional quantum-optical states. It establishes spherical, $s$-parametrized representations, their star products, transformations, and large-spin limits, then extends the framework to coupled spins and their dynamics. The work also develops analytical approximations and visualization methods for using phase-space descriptions to study complex quantum states.
koczor2016novel:
  abs: >-
    We introduce SFAM, a shifted fast-amplitude-modulation pulse scheme for improving multiple-quantum excitation in MQMAS solid-state NMR. The method combines population-transfer and modulation ideas to enhance triple-quantum excitation at relatively low radio-frequency power while remaining straightforward to optimize. Simulations and experiments show increased sensitivity and good robustness to RF miscalibration, inhomogeneity, and changes in quadrupole-coupling parameters, although anisotropic line-shape distortions must be considered.
koczor2015alternative:
  abs: >-
    Automatic tuning and matching are important for quantitative and remotely controlled NMR, especially under high-field, variable-temperature, or changing-sample conditions. We present a lower-cost computer-controlled tuning and matching system for existing Bruker solid-state NMR probes, built from commercially available components and integrated circuits rather than a dedicated probe with built-in automation. The design provides a practical route to remotely controlled probe adjustment while retaining the portability and lower cost of existing probes.
koczor2015pic:
  abs: >-
    We build an external analog-to-digital converter for acquiring wide-line solid-state NMR spectra on Bruker DRX and Avance-I spectrometers. The converter samples at up to 10 MHz, operates alongside the spectrometer's built-in ADC, and communicates with a computer over USB using software integrated with TopSpin. Tests on both consoles show that the system can capture broad spectra that would be undersampled by the original acquisition electronics.
