- id: algorithms
  icon: fa-solid fa-atom
  title: Quantum Algorithms & Applications
  summary: Developing quantum and hybrid algorithms for scientifically relevant problems and practical quantum advantage.
  detail: We develop quantum algorithms to solve challenging problems in quantum chemistry, materials science, optimisation, fluid dynamics etc. We work with a broad range of academic and industrial end-users in, e.g., pharmaceutical, financial, materials industries. Our research explores hybrid quantum-classical approaches that combine quantum resources with advanced classical processing, with an emphasis on identifying applications where quantum computers can provide meaningful computational advantages.

- id: fault-tolerance
  icon: fa-solid fa-shield-halved
  title: Fault-Tolerance & error handling
  summary: Making useful quantum computation possible with limited quantum resources.
  detail: We develop methods that reduce the resources required for reliable quantum computation, spanning quantum error correction, mitigation, error suppression, and synergies with early fault-tolerant algorithm design. We work with a broad range of academic and industrial hardware teams. We investigate trade-offs between qubit counts, circuit depth, sampling overhead, and error-correction resources to enable useful computations before large-scale fault-tolerant quantum computers become available.

- id: measurement
  icon: fa-solid fa-chart-line
  title: Quantum Measurement & Estimation
  summary: Extracting useful information from quantum computers with fewer measurements and computational resources.
  detail: We develop efficient methods for measuring and estimating properties of quantum systems, including randomized measurements, classical shadows, observable and amplitude estimation, and statistical post-processing. Our goal is to minimize measurement and circuit costs while retaining the information needed for quantum simulation, eigenstate problems, and other quantum algorithms.